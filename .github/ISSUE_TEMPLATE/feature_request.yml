name: Feature request
description: Suggest an improvement for DrPanda MCP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What troubleshooting or operational problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Read-only boundary impact
      description: Does this need any write operation, broader scope, new credentials, or new network access?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
