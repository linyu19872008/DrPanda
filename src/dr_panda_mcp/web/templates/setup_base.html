<!doctype html>
<html lang="{{ html_lang }}"{% if data_theme %} data-theme="{{ data_theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ product_name }}{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/icon.png?v={{ icon_version }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body data-msg-network="{{ t('网络异常，请检查连接后重试。') }}"
      data-msg-timeout="{{ t('请求超时，请稍后重试。') }}"
      data-msg-expired="{{ t('页面已过期，请刷新后重试。') }}"
      data-msg-generic="{{ t('操作失败，请稍后重试。') }}"
      data-msg-dirty="{{ t('有未保存的修改，离开后会丢失。确定离开？') }}">
  <noscript>
    <div class="alert alert--warning" role="status"><div class="alert__body"><strong>{{ t('此配置台需要启用 JavaScript。') }}</strong></div></div>
  </noscript>
  <header class="topbar">
    <div class="topbar__inner">
      <span class="brand">
        <img class="brand__mark" src="/static/icon.png?v={{ icon_version }}" alt="">
        <span class="brand__name">{{ brand_name }}</span>
        <span class="brand__sub">{{ t('MCP 配置台') }}</span>
      </span>
      <div class="topbar__side">
        <span class="chip">{{ t('首次安装') }}</span>
        <form class="lang-switch" method="post" action="/language" aria-label="{{ t('语言') }}">
          <input type="hidden" name="next" value="{{ current_url }}">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          {% for lang in language_options %}
          <button class="lang-switch__btn{% if lang.code == locale %} is-active{% endif %}" type="submit" name="lang" value="{{ lang.code }}" title="{{ lang.label }}">{{ lang.short }}</button>
          {% endfor %}
        </form>
      </div>
    </div>
  </header>
  <main id="main" class="container setup-container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v={{ app_script_version }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
