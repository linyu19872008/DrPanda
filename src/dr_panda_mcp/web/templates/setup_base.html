<!doctype html>
<html lang="{{ html_lang }}"{% if data_theme %} data-theme="{{ data_theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Dr Panda MCP{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='16' text-anchor='middle' fill='white'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <span class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Dr Panda</span>
        <span class="brand__sub">{{ t('MCP 配置台') }}</span>
      </span>
      <div class="topbar__side">
        <span class="chip">{{ t('首次安装') }}</span>
        <form class="lang-switch" method="post" action="/language" aria-label="{{ t('语言') }}">
          <input type="hidden" name="next" value="/setup">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          {% for lang in language_options %}
          <button class="lang-switch__btn{% if lang.code == locale %} is-active{% endif %}" type="submit" name="lang" value="{{ lang.code }}" title="{{ lang.label }}">{{ lang.short }}</button>
          {% endfor %}
        </form>
      </div>
    </div>
  </header>
  <main id="main" class="container setup-container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v={{ app_script_version }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
