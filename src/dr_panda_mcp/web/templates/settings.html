{% extends "base.html" %}
{% block title %}系统配置 · Dr Panda MCP{% endblock %}
{% block content %}
<h2>系统配置</h2>
{% if errors.get("_form") %}<p class="error">{{ errors["_form"] }}</p>{% endif %}
<form method="post" action="/settings">
  {% for row in rows %}
    <label>{{ row.label }}
      <input type="number" name="{{ row.key }}" value="{{ row.value }}">
      <small>默认 {{ row.default }}，范围 {{ row.low }}–{{ row.high }}</small>
    </label>
  {% endfor %}
  <p><button type="submit">保存</button></p>
</form>
<p><small>改动立即生效并写入审计；系统配置不能放宽只读、危险命令、密钥与目标范围限制。</small></p>
{% endblock %}
